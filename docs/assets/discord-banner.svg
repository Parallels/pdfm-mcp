    <text x="128" y="91" font-size="30" font-weight="700">Let's talk on Discord</text>
    <text x="128" y="120" font-size="16">Join the server, then head to #pdfm-mcp.</text>
    <text x="128" y="145" font-size="14" opacity=".85">Ask questions · Share ideas · Show what
