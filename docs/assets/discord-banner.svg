  </g>
  <rect x="692" y="69" width="176" height="44" rx="22" fill="#fff" />
  <text x="780" y="97" text-anchor="middle" fill="#343dab"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15"
    font-weight="700">Join Discord →</text>
</svg>